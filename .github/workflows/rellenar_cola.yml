name: Rellenar cola de guiones

on:
  schedule:
    - cron: "30 */6 * * *"  # cada 6 horas; solo genera si la cola baja de --min-cola
  workflow_dispatch:
    inputs:
      cantidad:
        description: "Máximo de guiones a generar en esta pasada"
        default: "5"
      min_cola:
        description: "No generar si ya hay tantos pendientes"
        default: "30"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  rellenar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar lote de guiones (sin repetir temas)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
        run: python src/generar_lote.py "${{ github.event.inputs.cantidad || 5 }}" --min-cola "${{ github.event.inputs.min_cola || 30 }}"

      - name: Guardar guiones nuevos en la cola
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content/pending/
          git diff --cached --quiet || git commit -m "Rellena cola de guiones [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push
