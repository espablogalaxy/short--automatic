name: Shorts Bot Diario

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC (08:00 en España): franja que más rinde en el canal de la Pi
    - cron: "0 9 * * *"   # 09:00 UTC
    - cron: "0 18 * * *"  # 18:00 UTC
    # Se retiró 12:00 UTC: en este canal es la franja más floja (mediana ~200 vistas vs ~1000-1100
    # a las 09 y 18 UTC, datos del 03/10/2026). Revisar con: python src/metricas.py --informe
  workflow_dispatch: {}    # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write   # necesario para poder commitear los guiones ya usados

# Un solo workflow a la vez escribe en el repo (evita carreras de push entre pipeline, cola y métricas).
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg y fuente para subtítulos
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
        run: python src/main.py

      - name: Guardar cambios (guion usado, logs)
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "Actualiza estado del pipeline [skip ci]"
          # El repo puede haber avanzado mientras corría el pipeline (varios minutos);
          # rebase antes de empujar para no fallar con "fetch first" por una carrera de commits.
          git fetch origin main
          git rebase origin/main
          git push
