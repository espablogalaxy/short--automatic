name: Shorts Bot Diario

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC
    - cron: "0 12 * * *"  # 12:00 UTC
    - cron: "0 18 * * *"  # 18:00 UTC (turno de respaldo)
  workflow_dispatch: {}    # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write   # necesario para poder commitear los guiones ya usados

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg y fuente para subtítulos
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
        run: python src/main.py

      - name: Guardar cambios (guion usado, logs)
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "Actualiza estado del pipeline [skip ci]"
          # El repo puede haber avanzado mientras corría el pipeline (varios minutos);
          # rebase antes de empujar para no fallar con "fetch first" por una carrera de commits.
          git fetch origin main
          git rebase origin/main
          git push
